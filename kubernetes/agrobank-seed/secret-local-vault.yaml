# OPTION B (no reachable Vault). Use with job-local-vault.yaml, instead of secret.yaml + job.yaml.
# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# Everything the seeder needs (others/agrobank-seed.md, "Vault secret layout").
# The seeder only reads credentials from Vault, so job-local-vault.yaml starts a throwaway
# in-memory Vault inside the Job pod, loads these keys into it at secret/amudario/agrobank/seed,
# and points the seeder at it. Delete this Secret once seeding is done.
# Keep every value in single quotes; a ' inside a value is written as ''.
apiVersion: v1
kind: Secret
metadata:
  name: agrobank-seed-env
  namespace: agrobank
  labels:
    app.kubernetes.io/name: agrobank-seed
    app.kubernetes.io/part-of: oxus
type: Opaque
stringData:
  # Backend PostGIS. The role needs INSERT/UPDATE + setval; the seeder sets
  # session_replication_role = replica, so a superuser is the simplest choice.
  BACKEND_DB_HOST: '<DB_SERVER>'
  BACKEND_DB_PORT: '5432'
  BACKEND_DB_NAME: 'amudario'           # must equal AGROBANK_SEED_CONFIRM in job-local-vault.yaml
  BACKEND_DB_USER: ''
  BACKEND_DB_PASSWORD: ''

  # Models PostGIS
  MODELS_DB_HOST: '<DB_SERVER>'
  MODELS_DB_PORT: '5433'
  MODELS_DB_NAME: 'oxus_models'
  MODELS_DB_USER: ''
  MODELS_DB_PASSWORD: ''

  # S3 (key needs PutObject + HeadObject)
  AWS_ENDPOINT: '<LINK>'
  AWS_BUCKET: '<IMAGES BUCKET NAME>'
  AWS_ACCESS_KEY_ID: ''
  AWS_SECRET_ACCESS_KEY: ''
  AWS_DEFAULT_REGION: 'auto'
  AWS_USE_PATH_STYLE_ENDPOINT: 'false'  # 'true' for MinIO / Ceph
  # S3_STORAGE_CLASS: ''                # uncomment only if the endpoint requires one
