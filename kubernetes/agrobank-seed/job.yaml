# One-off seeder (applications/agrobank-seed.md). Run it three times, changing only `args`:
#   1. ["preflight"]            -> must end with "OK    preflight complete — ready to seed"
#   2. ["seed", "--dry-run"]    -> rehearsal, everything rolled back
#   3. ["seed"]                 -> the real run (AGROBANK_SEED_CONFIRM below must equal the backend DB name)
# Later, any time:  ["verify"]
# A Job cannot be re-applied with new args: delete it first (README.md, step 6).
apiVersion: batch/v1
kind: Job
metadata:
  name: agrobank-seed
  namespace: agrobank
  labels:
    app.kubernetes.io/name: agrobank-seed
    app.kubernetes.io/part-of: oxus
spec:
  backoffLimit: 0                    # never retry a seed on its own
  ttlSecondsAfterFinished: 86400     # keep the pod (and its logs) for a day
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agrobank-seed
        app.kubernetes.io/part-of: oxus
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: seed
          image: registry.gitlab.com/amudario/development/agrobank-seed:latest
          imagePullPolicy: Always
          args: ["preflight"]
          envFrom:
            - secretRef:
                name: agrobank-seed-vault     # VAULT_ADDR + VAULT_TOKEN
          env:
            - name: AGROBANK_SEED_CONFIRM
              value: amudario
          volumeMounts:
            - name: state
              mountPath: /state
      volumes:
        # The docker setup used a named volume; inside one Job run emptyDir is equivalent.
        - name: state
          emptyDir: {}
