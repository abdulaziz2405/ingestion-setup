# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# Loaded as environment variables by job.yaml. Delete this Secret (and revoke the token
# in Vault) once seeding is done.
apiVersion: v1
kind: Secret
metadata:
  name: agrobank-seed-vault
  namespace: agrobank
  labels:
    app.kubernetes.io/name: agrobank-seed
    app.kubernetes.io/part-of: oxus
type: Opaque
stringData:
  VAULT_ADDR: 'http://<TOOL_SERVER>:8200'
  VAULT_TOKEN: '<VAULT_TOKEN>'          # can read secret/amudario/agrobank/seed
