apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxus-frontend
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-frontend
    app.kubernetes.io/part-of: oxus
spec:
  # Stateless static site: safe to run more than one.
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oxus-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxus-frontend
        app.kubernetes.io/part-of: oxus
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: oxus-frontend
      containers:
        - name: app
          image: registry.gitlab.com/amudario/development/frontend:agrobank-<FRONTEND_PIPELINE_IID>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            # limits:
            #   memory: 256Mi
