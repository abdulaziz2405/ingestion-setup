# Use EITHER this file OR ingress.yaml, not both.
# Catch-all: everything not matched by /api, /models, /prefect lands here
# (longest prefix wins, so the order of applying does not matter).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oxus-frontend
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-frontend
    app.kubernetes.io/part-of: oxus
spec:
  parentRefs:
    - name: <GATEWAY_NAME>
      namespace: <GATEWAY_NAMESPACE>
  hostnames:
    - <DOMAIN>
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oxus-frontend
          port: 9090
