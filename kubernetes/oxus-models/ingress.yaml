# Use EITHER this file OR httproute.yaml, not both.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oxus-models
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-models-api
    app.kubernetes.io/part-of: oxus
  annotations:
    # ingress-nginx; other controllers ignore these (see README.md "Routing").
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: <INGRESS_CLASS>
  tls:
    - hosts:
        - <DOMAIN>
      secretName: agrobank-tls
  rules:
    - host: <DOMAIN>
      http:
        paths:
          # Path is passed through untouched: the app runs with API_ROOT_PATH=/models/api.
          - path: /models
            pathType: Prefix
            backend:
              service:
                name: oxus-models-api
                port:
                  name: http
