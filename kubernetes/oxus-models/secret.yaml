# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# The app takes these as environment variables (docker --env-file on the VM), so both
# deployment-api.yaml and deployment-celery.yaml load every key here via envFrom.
# Keep every value in single quotes; a ' inside a value is written as ''.
# Same variables as applications/oxus-models/example.env. Lines marked [K8S] differ from the VM setup.
apiVersion: v1
kind: Secret
metadata:
  name: oxus-models-env
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-models-api
    app.kubernetes.io/part-of: oxus
type: Opaque
stringData:
  # 1. Application configuration:
  API_ROOT_PATH: '/models/api'
  APP_ENV: 'production'
  INTERNAL_API_TOKEN: '<INTERNAL TOKEN SHARED BY APPS>'
  TZ: 'Asia/Tashkent'

  # 2. S3 storage configuration:
  AWS_ACCESS_KEY_ID: ''
  AWS_BUCKET: '<IMAGES BUCKET NAME>'
  AWS_DEFAULT_LOCATION: 'auto'
  AWS_ENDPOINT: '<LINK>'
  AWS_SECRET_ACCESS_KEY: ''

  # 3. Oxus-Backend's PostgreSQL database connection:
  BACKEND_DB_HOST: '<DB_SERVER>'
  BACKEND_DB_PORT: '5432'
  BACKEND_DB_NAME: 'amudario'
  BACKEND_DB_USER: ''
  BACKEND_DB_PASSWORD: ''

  # 4. Oxus-Models' PostgreSQL database connection:
  # The MYSQL_ prefix is historical — these point at a PostgreSQL instance, the one on port 5433.
  MYSQL_HOST: '<DB_SERVER>'
  MYSQL_PORT: '5433'
  MYSQL_DATABASE: 'oxus_models'
  MYSQL_USER: ''
  MYSQL_PASSWORD: ''

  # 5. InfluxDB database connection:
  INFLUX_BUCKET: '<INFLUX BUCKET NAME>'
  INFLUX_ORG: '<INFLUX ORG NAME>'
  INFLUX_TOKEN: '<INFLUX GENERATED TOKEN>'
  INFLUX_URL: 'http://<INGESTION_SERVER>:8086'

  # 6. Knowledge base parameters:
  KB_ROOT: '/knowledge_base'
  KB_STORAGE_BACKEND: 'spaces'

  # 7. Redis and Celery parameters:
  CELERY_BROKER_URL: 'redis://:<REDIS PASSWORD>@<DB_SERVER>:6379/1'
  CELERY_RESULT_BACKEND: 'redis://:<REDIS PASSWORD>@<DB_SERVER>:6379/2'
  REDIS_HOST: '<DB_SERVER>'
  REDIS_PASSWORD: '<REDIS PASSWORD>'
  REDIS_PORT: '6379'
  REDIS_PREFECT_DB: '3'

  # 8. Oxus-Backend API:
  # [K8S] in-cluster Service instead of <APPLICATION_SERVER>:8080
  OXUS_BACKEND_URL: 'http://oxus-backend:8080'

  # 9. Weather provider:
  OPEN_METEO_API_KEY: ''
