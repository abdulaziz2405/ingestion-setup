# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# Pull secret for registry.gitlab.com, referenced as `gitlab-registry` by every workload.
# The deploy token is in Vault UI: secrets -> amudario -> tools -> gitlab -> agrobank-deploy-token
# Plain username/password are accepted by the kubelet: no base64 to compute.
apiVersion: v1
kind: Secret
metadata:
  name: gitlab-registry
  namespace: agrobank
  labels:
    app.kubernetes.io/part-of: oxus
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "registry.gitlab.com": {
          "username": "<DEPLOY_TOKEN_USERNAME>",
          "password": "<DEPLOY_TOKEN>"
        }
      }
    }
