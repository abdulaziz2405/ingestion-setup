# OPTIONAL: only if there is NO cert-manager (otherwise use certificate.yaml) and you have
# the certificate files. Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit it.
# Paste the PEM blocks indented 4 spaces; tls.crt = full chain (server cert first).
apiVersion: v1
kind: Secret
metadata:
  name: agrobank-tls
  namespace: agrobank
  labels:
    app.kubernetes.io/part-of: oxus
type: kubernetes.io/tls
stringData:
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    <CERTIFICATE>
    -----END CERTIFICATE-----
    -----BEGIN CERTIFICATE-----
    <INTERMEDIATE CERTIFICATE>
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    <PRIVATE KEY>
    -----END PRIVATE KEY-----
