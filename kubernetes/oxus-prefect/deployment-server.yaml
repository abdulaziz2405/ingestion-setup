apiVersion: apps/v1
kind: Deployment
metadata:
  name: oxus-prefect-server
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-prefect-server
    app.kubernetes.io/part-of: oxus
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: oxus-prefect-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oxus-prefect-server
        app.kubernetes.io/part-of: oxus
    spec:
      # Must stay false: a Service named like prefect-* would inject PREFECT_* env vars
      # that Prefect tries to parse as its own settings.
      enableServiceLinks: false
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: server
          image: registry.gitlab.com/amudario/development/oxus-prefect:agrobank-<PREFECT_PIPELINE_IID>
          imagePullPolicy: IfNotPresent
          args: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
          envFrom:
            - secretRef:
                name: oxus-prefect-server-env
          ports:
            - name: http
              containerPort: 4200
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # From the docker flags: --cpus 2, --memory 1500m, --memory-reservation 768m.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1500Mi
