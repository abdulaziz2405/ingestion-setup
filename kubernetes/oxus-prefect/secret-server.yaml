# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# Loaded as environment variables by deployment-server.yaml (envFrom).
# Keep every value in single quotes; a ' inside a value is written as ''.
# Same variables as applications/oxus-prefect/example.server.env (nothing differs for Kubernetes).
apiVersion: v1
kind: Secret
metadata:
  name: oxus-prefect-server-env
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-prefect-server
    app.kubernetes.io/part-of: oxus
type: Opaque
stringData:
  # Both auth strings hold the same <USER>:<PASSWORD> pair, and the worker repeats it in
  # its own PREFECT_API_AUTH_STRING (secret-worker.yaml).
  PREFECT_API_AUTH_STRING: '<USER>:<PASSWORD>'
  PREFECT_SERVER_API_AUTH_STRING: '<USER>:<PASSWORD>'

  PREFECT_API_DATABASE_CONNECTION_URL: 'postgresql+asyncpg://prefect:<PREFECT_DB_PASSWORD>@<TOOL_SERVER>:5432/prefect'
  PREFECT_SERVER_LOGGING_LEVEL: 'DEBUG'
  PREFECT_UI_API_URL: 'https://<DOMAIN>/prefect/api/'
  PREFECT_UI_SERVE_BASE: '/prefect'
  PREFECT_UI_URL: 'https://<DOMAIN>/'
  TZ: 'Asia/Tashkent'
