# Fill in on the deploy machine, `kubectl apply -f`, and do NOT commit real values.
# Loaded as environment variables by deployment-worker.yaml (envFrom), init containers included.
# Keep every value in single quotes; a ' inside a value is written as ''.
# Same variables as applications/oxus-prefect/example.worker.env. Lines marked [K8S] differ from the VM setup.
apiVersion: v1
kind: Secret
metadata:
  name: oxus-prefect-worker-env
  namespace: agrobank
  labels:
    app.kubernetes.io/name: oxus-prefect-worker
    app.kubernetes.io/part-of: oxus
type: Opaque
stringData:
  # 1. Application configuration:
  PREFECT_API_AUTH_STRING: '<USER FROM SERVER SECRET>:<PASSWORD FROM SERVER SECRET>'
  # [K8S] in-cluster Service instead of <APPLICATION_SERVER>:4200
  PREFECT_API_URL: 'http://oxus-prefect-server:4200/api'
  PREFECT_LOGGING_EXTRA_LOGGERS: 'autofiller,backend_agro_alerts,backend_forecasts,backend_meteoblue_scraper,backend_station_monitor,daily_pipeline,lib,models_fill_historical_stats,models_fill_station_stats,models_insert_station_devices,models_irrigation_calendar,models_recompute_et0,models_refine_historical_stats,pests_daily_pipeline,recompute_pest_stages,regional_weather,sensor_backfill,train_forecast_adjust,warm_forecast_cache'
  PREFECT_WORKER_POOL: 'prod'
  PYTHONPATH: '/opt/prefect/flows'
  TZ: 'Asia/Tashkent'

  # 2. Oxus-Backend and Oxus-Models APIs:
  # Each token is the INTERNAL_API_TOKEN of that app.
  # [K8S] in-cluster Services, never the public domain (the apps refuse /internal/* via a proxy).
  OXUS_BACKEND_URL: 'http://oxus-backend:8080'
  OXUS_BACKEND_INTERNAL_TOKEN: '<INTERNAL_API_TOKEN FROM OXUS-BACKEND>'
  OXUS_MODELS_URL: 'http://oxus-models-api:8011/models/api'
  OXUS_MODELS_INTERNAL_TOKEN: '<INTERNAL_API_TOKEN FROM OXUS-MODELS>'

  # 3. Weather provider:
  OPEN_METEO_API_KEY: ''
  METEOBLUE_LOGIN: ''
  METEOBLUE_PWD: ''
